---
# Initial Contabo VPS setup — run once after provisioning.
# Usage:
#   ansible-playbook -i inventory.yml playbook.yml \
#     --extra-vars "deploy_ssh_public_key='$(cat ~/.ssh/deploy_id_ed25519.pub)'"

- name: Bootstrap portfolio VPS
  hosts: vps
  become: true
  vars:
    deploy_user: deploy
    app_dir: /opt/portfolio

  tasks:
    # ── System update ──────────────────────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      apt:
        upgrade: safe

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
          - fail2ban
          - git
          - wget
        state: present

    # ── Docker ─────────────────────────────────────────────────────────────────
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker daemon
      systemd:
        name: docker
        enabled: true
        state: started

    # ── Deploy user ────────────────────────────────────────────────────────────
    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: docker
        create_home: true
        state: present

    - name: Add GitHub Actions SSH public key to deploy user
      authorized_key:
        user: "{{ deploy_user }}"
        state: present
        key: "{{ deploy_ssh_public_key }}"

    # ── Application directory ──────────────────────────────────────────────────
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Copy docker-compose.prod.yml to server
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.prod.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Copy Caddyfile to server
      copy:
        src: ../Caddyfile
        dest: "{{ app_dir }}/Caddyfile"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Remind operator to create .env
      debug:
        msg: >
          ACTION REQUIRED: Copy your completed .env.prod file to
          {{ app_dir }}/.env on the server before first deploy.
          Use: scp .env.prod deploy@{{ ansible_host }}:{{ app_dir }}/.env

    # ── Firewall (UFW) ─────────────────────────────────────────────────────────
    - name: Set UFW default deny incoming
      ufw:
        default: deny
        direction: incoming

    - name: Set UFW default allow outgoing
      ufw:
        default: allow
        direction: outgoing

    - name: Allow SSH (22)
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP (80)
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS (443 TCP)
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow HTTPS (443 UDP — HTTP/3)
      ufw:
        rule: allow
        port: "443"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

    # ── fail2ban ───────────────────────────────────────────────────────────────
    - name: Configure fail2ban for SSH
      copy:
        content: |
          [sshd]
          enabled = true
          port = 22
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 5
          bantime = 3600
          findtime = 600
        dest: /etc/fail2ban/jail.local
        mode: "0644"
      notify: restart fail2ban

    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: true
        state: started

    # ── SSH hardening ──────────────────────────────────────────────────────────
    - name: Disable root password login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin prohibit-password"
        validate: sshd -t -f %s
      notify: restart sshd

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        validate: sshd -t -f %s
      notify: restart sshd

  handlers:
    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: restart sshd
      systemd:
        name: sshd
        state: restarted
