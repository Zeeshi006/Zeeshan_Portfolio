name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Build Docker images and push to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ────────────────────────────────────────────────────────────
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/portfolio-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/portfolio-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web image (NEXT_PUBLIC_* vars baked in at build time) ─────────────
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/portfolio-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/portfolio-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — SSH into VPS and roll out new images
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: hammadafzalcode
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,GHCR_USER
          script: |
            set -e

            # Authenticate with GHCR so private images can be pulled
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /opt/portfolio

            # Pull latest images from GHCR
            docker compose -f docker-compose.prod.yml pull

            # Ensure postgres and redis are running before migrations
            docker compose -f docker-compose.prod.yml up -d postgres redis

            # Wait for postgres to be ready (up to 60s)
            echo "Waiting for postgres..."
            timeout 60 sh -c 'until docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U portfolio; do sleep 2; done'

            # Run migrations
            docker compose -f docker-compose.prod.yml run --rm --no-deps api \
              node_modules/.bin/prisma migrate deploy

            # Start / update all containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Free disk — remove images no longer referenced by any container
            docker image prune -f

            echo "Deployment complete — $(date -u)"
